# Publishes the app to GitHub Pages on every push to main.
#
# Pages is a static host: there is no API proxy there, so the app detects that
# at runtime and switches the assistant features off with an explanation. The
# inventory, photos, set binder and charts all work.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Pages must already be on, with its source set to GitHub Actions
      # (Settings -> Pages -> Build and deployment -> Source). The workflow
      # token cannot create the site itself — it fails with "Resource not
      # accessible by integration" — so `enablement` only covers the case
      # where a token that can is in use. `base_path` is the project-pages
      # subdirectory the site is served from.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
